<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      background: #1f2937;
      color: white;
      padding: 1rem 2rem;
    }

    .header nav {
      display: flex;
      gap: 1.5rem;
    }

    .header a {
      color: white;
      text-decoration: none;
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: #1f2937;
      color: white;
      padding: 1rem 2rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <h2>My Portfolio</h2>
    <nav>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Welcome</h1>
    <p>This is my portfolio page.</p>
  </main>

  <footer class="footer">
    <p>&copy; 2026 My Portfolio</p>
    <p>contact@example.com</p>
  </footer>
</body>
</html>
