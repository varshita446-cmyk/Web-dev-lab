<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Flexbox</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .navbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #1f2937;
      padding: 1rem 2rem;
    }

    .navbar h2 {
      color: white;
      margin: 0;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0.25rem 0.75rem;
    }

    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      padding: 2rem;
    }

    .card {
      flex: 1 1 250px;
      background: #f3f4f6;
      padding: 1rem;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <h2>My Portfolio</h2>
    <div>
      <a href="#home">Home</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="card-grid">
    <div class="card">
      <h3>Project One</h3>
      <p>A short description</p>
    </div>
    <div class="card">
      <h3>Project Two</h3>
      <p>A short description</p>
    </div>
    <div class="card">
      <h3>Project Three</h3>
      <p>A short description</p>
    </div>
  </section>
</body>
</html>
